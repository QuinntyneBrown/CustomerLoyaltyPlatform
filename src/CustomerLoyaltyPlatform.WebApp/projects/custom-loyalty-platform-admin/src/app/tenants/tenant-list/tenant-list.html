<div class="tenant-list-container">
  <div class="header">
    <h1>Tenants</h1>
    <a mat-raised-button color="primary" routerLink="/tenants/create">
      <mat-icon>add</mat-icon>
      Create Tenant
    </a>
  </div>

  <ng-container *ngIf="vm$ | async as vm">
    <div *ngIf="vm.loading" class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="vm.error" class="error-container">
      <mat-card>
        <mat-card-content>
          <p class="error-message">{{ vm.error }}</p>
        </mat-card-content>
      </mat-card>
    </div>

    <mat-card *ngIf="!vm.loading && !vm.error">
      <mat-card-content>
        <table mat-table [dataSource]="vm.tenants" class="tenant-table">
          <ng-container matColumnDef="tenantName">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant.tenantName }}</td>
          </ng-container>

          <ng-container matColumnDef="tenantSlug">
            <th mat-header-cell *matHeaderCellDef>Slug</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant.tenantSlug }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let tenant">
              <mat-chip [color]="getStatusColor(tenant.status)" selected>
                {{ tenant.status }}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="planType">
            <th mat-header-cell *matHeaderCellDef>Plan</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant.planType }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let tenant">
              <a mat-icon-button [routerLink]="['/tenants', tenant.tenantId]" aria-label="View tenant">
                <mat-icon>visibility</mat-icon>
              </a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
              No tenants found. Create your first tenant to get started.
            </td>
          </tr>
        </table>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
